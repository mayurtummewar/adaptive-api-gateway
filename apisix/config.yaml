apisix:
  node_listen: 9080
  enable_admin: true
  enable_control: true

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    allow_admin:
      - 127.0.0.0/24
      - 172.0.0.0/8
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}
        role: admin
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30
